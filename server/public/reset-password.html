<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Password — GENSA</title>
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#8A5A33">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-brand">
      <img class="auth-logo" src="/icon-192.png" width="44" height="44" alt="">
      <div>
        <p class="auth-brand-name">GENSA</p>
        <p class="auth-brand-subtitle">Platform Manajemen Generus</p>
      </div>
    </div>
    <h1 id="heading">Lupa Password</h1>

    <form id="request-form" hidden>
      <p class="auth-description">Kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.</p>
      <label for="email">ALAMAT EMAIL</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="nama@email.com"
        required
      >
      <button type="submit">Kirim Tautan Reset</button>
    </form>

    <form id="confirm-form" hidden>
      <label for="new-password">PASSWORD BARU</label>
      <input
        id="new-password"
        name="new_password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        aria-describedby="password-hint"
        required
      >
      <p id="password-hint" class="hint">Gunakan minimal 8 karakter.</p>

      <label for="confirm-password">KONFIRMASI PASSWORD</label>
      <input
        id="confirm-password"
        name="confirm_password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >
      <button type="submit">Simpan Password Baru</button>
    </form>

    <p id="status" role="status" aria-atomic="true"></p>
    <p class="back"><a href="/login.html">Kembali ke halaman masuk</a></p>

    <footer class="auth-footer">
      <span>Sistem Informasi Manajemen Generus</span>
      <span class="auth-version">v 1.0</span>
    </footer>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    const requestForm = document.getElementById('request-form');
    const confirmForm = document.getElementById('confirm-form');
    const statusElement = document.getElementById('status');

    if (token) {
      document.title = 'Atur Password Baru — GENSA';
      document.getElementById('heading').textContent = 'Atur Password Baru';
      confirmForm.hidden = false;
    } else {
      requestForm.hidden = false;
    }

    function showMessage(message, kind) {
      statusElement.textContent = message;
      statusElement.dataset.kind = kind;
    }

    async function postJSON(url, payload) {
      let response;
      try {
        response = await fetch(url, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });
      } catch {
        throw new Error('Tidak dapat terhubung ke server. Silakan coba lagi.');
      }

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        const message =
          typeof data?.error === 'string' ? data.error :
          typeof data?.message === 'string' ? data.message :
          'Permintaan belum berhasil. Silakan coba lagi.';
        throw new Error(message);
      }
    }

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = requestForm.querySelector('button');
      if (button.disabled) return;

      button.disabled = true;
      showMessage('Mengirim permintaan…', 'pending');

      try {
        await postJSON('/api/reset-password', {
          email: document.getElementById('email').value.trim(),
        });
        showMessage(
          'Jika akun tersedia, petunjuk reset akan disiapkan.',
          'success'
        );
      } catch (error) {
        showMessage(error.message, 'error');
      } finally {
        button.disabled = false;
      }
    });

    confirmForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = confirmForm.querySelector('button');
      if (button.disabled) return;

      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password');

      if (password.length < 8) {
        showMessage('Password harus minimal 8 karakter.', 'error');
        document.getElementById('new-password').focus();
        return;
      }

      if (password !== confirmation.value) {
        showMessage('Konfirmasi password belum sama.', 'error');
        confirmation.focus();
        return;
      }

      button.disabled = true;
      showMessage('Menyimpan password baru…', 'pending');

      try {
        await postJSON('/api/reset-password/confirm', {
          token,
          new_password: password,
        });
        confirmForm.reset();
        confirmForm.hidden = true;
        showMessage(
          'Password berhasil diubah. Silakan masuk.',
          'success'
        );
      } catch (error) {
        showMessage(error.message, 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
