<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E9">
  <meta name="referrer" content="no-referrer">
  <title>Kelola izin — GENSA</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      color-scheme: light;
      --krem: #F6F1E9;
      --coklat: #8A5A33;
      --sage: #5F7A57;
      --sage-muda: #7C9A6E;
      --teks: #483B30;
      --garis: #D8CDBE;
      --putih: #FFFDFA;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--krem);
      color: var(--teks);
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1, h2, h3 { color: var(--coklat); }
    h1 { margin: 12px 0 8px; }
    h2 { margin: 0 0 12px; font-size: 1.25rem; }
    h3 { margin: 0 0 8px; font-size: 1.1rem; }
    p { margin: 0 0 12px; }
    a { color: var(--coklat); }

    .kembali {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }

    .kartu {
      background: var(--putih);
      border: 1px solid var(--garis);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    label { display: block; font-weight: 600; margin-bottom: 6px; }

    input, button { font: inherit; }

    input {
      display: block;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--garis);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--putih);
      color: var(--teks);
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--coklat);
      color: white;
      cursor: pointer;
    }

    button.secondary { background: var(--sage); }
    button:disabled { opacity: 0.6; cursor: wait; }

    :focus-visible {
      outline: 3px solid var(--sage-muda);
      outline-offset: 3px;
    }

    .aksi {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .keterangan { white-space: pre-wrap; }
    #daftar { margin-top: 16px; }

    #pesan {
      margin: 16px 0;
      padding: 12px 16px;
      background: #ECEFE5;
      border-left: 4px solid var(--sage);
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #pesan[data-jenis="error"] {
      background: #F2E5D9;
      border-left-color: var(--coklat);
    }

    @media (max-width: 480px) {
      .kartu { padding: 16px; }
      .aksi button { width: 100%; }
    }
  
/* Shell navigasi v1 (Sesi 12d) — menu + tampilan sama seperti demo v1 */
.app-layout{display:flex;min-height:100vh}
.app-layout > main{flex:1;min-width:0;max-width:none;margin:0;padding:26px 30px 60px}
.sidebar{width:248px;flex:0 0 248px;background:#FBF7EE;border-right:1px solid #E9DFCE;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand-row{padding:2px 8px 14px;border-bottom:1px solid #E9DFCE;margin-bottom:14px}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand-logo{width:34px;height:42px;border-radius:10px;flex:0 0 34px;overflow:hidden;background:none}
.brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#2C2620}
.brand-sub{font-size:12.5px;color:#7A6F61}
.side-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#7A6F61;background:none;border:none;width:100%;text-align:left;font-size:14px;font-weight:600;text-decoration:none}
.side-link .ic{font-size:17px;width:22px;text-align:center}
.side-link:hover{background:rgba(124,154,110,.07);color:#2C2620}
.side-link.active{background:rgba(124,154,110,.13);color:#5F7A57}
.side-user{margin-top:auto;background:#FFFDF8;border:1px solid #E9DFCE;border-radius:12px;padding:12px}
.side-user .nm{font-weight:700;font-size:13.5px;color:#2C2620}
.side-user .rl{font-size:12px;color:#5F7A57}
.side-user button{margin-top:9px;width:100%;background:none;border:1px solid #DCCFB6;color:#7A6F61;border-radius:8px;padding:7px;font-size:12.5px;font-weight:600}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.title-row{display:flex;align-items:center;gap:10px}
.topbar h2{font-size:24px;font-weight:800;letter-spacing:-.02em;color:#2C2620}
.topbar .sub{color:#7A6F61;font-size:13.5px;margin-top:3px}
.scope-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(124,154,110,.09);border:1px solid rgba(124,154,110,.3);color:#5F7A57;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700}
.menu-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:#FFFFFF;border:1px solid #DCCFB6;color:#2C2620;font-size:18px}
@media (max-width:860px){
  .sidebar{position:fixed;z-index:40;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .app-layout > main{padding:20px 16px 50px}
  .menu-btn{display:inline-flex !important}
}
</style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <button class="menu-btn" id="closeMenuBtn" type="button" aria-label="Tutup menu">×</button>
      <div class="brand-row">
        <div class="brand-logo"><img src="/icon-192.png" alt="Logo GENSA"></div>
        <div><div class="brand-name" style="font-size:16px">GENSA</div><div class="brand-sub">Platform Manajemen Generus</div></div>
      </div>
      <a class="side-link" href="/dashboard.html"><span class="ic">▦</span> Dashboard</a>
      <a class="side-link" href="/generus.html"><span class="ic">👥</span> Daftar Generus</a>
      <a class="side-link" href="/materi.html"><span class="ic">📖</span> Materi</a>
      <a class="side-link" href="/jadwal.html"><span class="ic">🗓</span> Jadwal Mengaji</a>
      <a class="side-link active" href="/izin-kelola.html"><span class="ic">✉️</span> Izin</a>
      <a class="side-link" href="/laporan.html"><span class="ic">💬</span> Laporan WhatsApp</a>
      <a class="side-link" href="/cetak-qr.html"><span class="ic">▣</span> Cetak QR Code</a>
      <a class="side-link" id="akunLink" href="/akun.html" hidden><span class="ic">⚙</span> Akun</a>
      <div class="side-user">
        <div class="nm" id="userName"></div>
        <div class="rl" id="userRole"></div>
        <button id="logoutBtn" type="button">Keluar</button>
      </div>
    </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="title-row">
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">☰</button>
          <h2 id="pageTitle">Kelola izin</h2>
        </div>
        <div class="sub" id="pageSub">Bagikan tautan kegiatan dan periksa pengajuan yang masuk.</div>
      </div>
      <span class="scope-badge" id="scopeBadge"></span>
    </div>

    <a class="kembali" href="/jadwal.html">Kembali ke jadwal</a>
    
    

    <p id="pesan" role="status" aria-live="polite" hidden></p>

    <section id="bagian-link" class="kartu" hidden>
      <h2>Tautan izin</h2>
      <label for="link-izin">Link untuk dibagikan</label>
      <input
        id="link-izin"
        type="text"
        readonly
        autocomplete="off"
        spellcheck="false"
      >
      <div class="aksi">
        <button id="salin" type="button" class="secondary">
          Salin link
        </button>
      </div>
    </section>

    <section id="bagian-daftar" hidden>
      <h2>Pengajuan izin</h2>
      <div id="daftar"></div>
    </section>
    </main>
</div>

  <script>
    'use strict';

    const pertemuanId = new URLSearchParams(location.search)
      .get('pertemuan');

    const pesan = document.getElementById('pesan');
    const bagianLink = document.getElementById('bagian-link');
    const bagianDaftar = document.getElementById('bagian-daftar');
    const linkIzin = document.getElementById('link-izin');
    const salin = document.getElementById('salin');
    const daftar = document.getElementById('daftar');

    let sedangMemutuskan = false;

    function beriPesan(teks, jenis = 'info') {
      pesan.textContent = teks;
      pesan.dataset.jenis = jenis;
      pesan.hidden = !teks;
    }

    function buatElemen(tag, teks, kelas) {
      const elemen = document.createElement(tag);
      if (teks !== undefined) elemen.textContent = teks;
      if (kelas) elemen.className = kelas;
      return elemen;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        credentials: 'same-origin',
        cache: 'no-store',
        headers: {
          Accept: 'application/json',
          ...(options.body ? { 'Content-Type': 'application/json' } : {})
        }
      });

      if (response.status === 401) {
        location.replace('/login.html');
        throw new Error('Silakan masuk kembali.');
      }

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error('Respons server tidak dapat dibaca.');
      }

      if (!response.ok) {
        throw new Error(
          typeof data?.error === 'string' ? data.error :
          typeof data?.message === 'string' ? data.message :
          'Permintaan belum berhasil. Silakan coba lagi.'
        );
      }

      return data;
    }

    function formatWaktu(nilai) {
      const waktu = new Date(nilai);

      if (Number.isNaN(waktu.getTime())) return '—';

      return new Intl.DateTimeFormat('id-ID', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(waktu);
    }

    function aturTombolPutusan(disabled) {
      for (const tombol of daftar.querySelectorAll('button.putusan')) {
        tombol.disabled = disabled;
      }
    }

    function tampilkanDaftar(items) {
      daftar.replaceChildren();

      if (items.length === 0) {
        daftar.append(buatElemen(
          'p',
          'Belum ada pengajuan izin untuk kegiatan ini.',
          'kartu'
        ));
        return;
      }

      const labelStatus = {
        menunggu: 'Menunggu',
        disetujui: 'Disetujui',
        ditolak: 'Ditolak'
      };

      for (const item of items) {
        const kartu = buatElemen('article', undefined, 'kartu');

        kartu.append(
          buatElemen('h3', item.nama),
          buatElemen('p', 'Kelas: ' + (item.kelas_sekolah ?? '—')),
          buatElemen(
            'p',
            'Alasan: ' + (item.alasan === 'sakit' ? 'Sakit' : 'Izin')
          ),
          buatElemen(
            'p',
            'Keterangan: ' + (item.keterangan || '—'),
            'keterangan'
          ),
          buatElemen(
            'p',
            'Status: ' + (labelStatus[item.status] || item.status)
          ),
          buatElemen('p', 'Dikirim: ' + formatWaktu(item.created_at))
        );

        if (item.catatan_penolakan) {
          kartu.append(buatElemen(
            'p',
            'Catatan penolakan: ' + item.catatan_penolakan,
            'keterangan'
          ));
        }

        if (item.status === 'menunggu') {
          const aksi = buatElemen('div', undefined, 'aksi');

          const setujui = buatElemen(
            'button',
            'Setujui',
            'putusan secondary'
          );
          setujui.type = 'button';
          setujui.disabled = sedangMemutuskan;
          setujui.addEventListener('click', () => {
            putuskan(item.id, 'setujui');
          });

          const tolak = buatElemen('button', 'Tolak', 'putusan');
          tolak.type = 'button';
          tolak.disabled = sedangMemutuskan;
          tolak.addEventListener('click', () => {
            putuskan(item.id, 'tolak');
          });

          aksi.append(setujui, tolak);
          kartu.append(aksi);
        }

        daftar.append(kartu);
      }
    }

    async function muatDaftar() {
      const data = await api(
        '/api/pertemuan/' + pertemuanId + '/izin'
      );

      tampilkanDaftar(data.izin);
      bagianDaftar.hidden = false;
    }

    async function putuskan(izinId, tindakan) {
      if (sedangMemutuskan) return;

      let catatan = null;

      if (tindakan === 'tolak') {
        const jawaban = window.prompt(
          'Catatan penolakan (opsional, maksimal 500 karakter):',
          ''
        );

        if (jawaban === null) return;

        catatan = jawaban.trim() || null;

        if (catatan && catatan.length > 500) {
          beriPesan('Catatan maksimal 500 karakter.', 'error');
          return;
        }
      }

      sedangMemutuskan = true;
      aturTombolPutusan(true);
      beriPesan('Menyimpan putusan…');

      let tersimpan = false;

      try {
        await api(
          '/api/pertemuan/' + pertemuanId +
          '/izin/' + izinId + '/' + tindakan,
          {
            method: 'POST',
            body: JSON.stringify(
              tindakan === 'tolak' ? { catatan } : {}
            )
          }
        );

        tersimpan = true;
        await muatDaftar();

        beriPesan(
          tindakan === 'setujui'
            ? 'Izin disetujui dan sudah masuk absensi.'
            : 'Izin ditolak.'
        );
      } catch (error) {
        beriPesan(
          tersimpan
            ? 'Putusan tersimpan, tetapi daftar belum dapat dimuat ulang. ' +
              'Muat ulang halaman untuk melihat hasilnya.'
            : error.message,
          'error'
        );
      } finally {
        sedangMemutuskan = false;
        aturTombolPutusan(false);
      }
    }

    salin.addEventListener('click', async () => {
      let berhasil = false;

      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(linkIzin.value);
          berhasil = true;
        } catch {
          // Lanjutkan ke fallback.
        }
      }

      if (!berhasil) {
        linkIzin.focus();
        linkIzin.select();
        linkIzin.setSelectionRange(0, linkIzin.value.length);

        try {
          berhasil = document.execCommand('copy');
        } catch {
          berhasil = false;
        }
      }

      beriPesan(
        berhasil
          ? 'Link izin disalin.'
          : 'Link belum dapat disalin otomatis. Salin teks pada kolom tautan.',
        berhasil ? 'info' : 'error'
      );
    });

    async function mulai() {
      if (
        !pertemuanId ||
        !/^[1-9]\d*$/.test(pertemuanId) ||
        !Number.isSafeInteger(Number(pertemuanId))
      ) {
        beriPesan('Buka halaman ini dari jadwal.', 'error');
        return;
      }

      beriPesan('Memuat pengajuan izin…');

      try {
        await api('/api/me');

        const data = await api(
          '/api/pertemuan/' + pertemuanId + '/link-izin'
        );

        if (
          typeof data.url !== 'string' ||
          !/^\/izin\.html\?t=[a-f0-9]{32}$/.test(data.url)
        ) {
          throw new Error('Tautan izin dari server tidak valid.');
        }

        linkIzin.value = location.origin + data.url;
        bagianLink.hidden = false;

        await muatDaftar();
        beriPesan('');
      } catch (error) {
        beriPesan(error.message, 'error');
      }
    }

    mulai();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

<script>
/* Navigasi sidebar v1 (Sesi 12d) — isi nama/peran, tombol keluar, menu HP. */
(function () {
  'use strict';
  var sidebar = document.getElementById('sidebar');
  var menuBtn = document.getElementById('menuBtn');
  var akunLink = document.getElementById('akunLink');
  var roleLabels = { admin: 'Admin \u00b7 akses penuh', daerah: 'Daerah \u00b7 lihat semua', desa: 'Desa', kelompok: 'Kelompok' };
  function setMenu(open) {
    if (!sidebar || !menuBtn) return;
    sidebar.classList.toggle('open', !!open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if (menuBtn) menuBtn.addEventListener('click', function () { setMenu(!sidebar.classList.contains('open')); });
  var closeBtn = document.getElementById('closeMenuBtn');
  if (closeBtn) closeBtn.addEventListener('click', function () { setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', async function () {
    logoutBtn.disabled = true;
    try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    window.location.replace('/login.html');
  });
  fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) {
      if (r.status === 401) { window.location.replace('/login.html'); return null; }
      return r.json();
    })
    .then(function (data) {
      if (!data || !data.user) return;
      var u = data.user;
      var name = document.getElementById('userName'); if (name) name.textContent = u.email || '';
      var label = roleLabels[u.role] || u.role || '';
      var role = document.getElementById('userRole'); if (role) role.textContent = label;
      var badge = document.getElementById('scopeBadge'); if (badge) badge.textContent = label;
      if (u.role === 'admin' && akunLink) akunLink.hidden = false;
    })
    .catch(function () {});
})();
</script>

</body>
</html>
