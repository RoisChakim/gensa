<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E9">
  <meta name="referrer" content="no-referrer">
  <title>Kirim izin — GENSA</title>
  <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/app.css">
  <style>
    .kartu{padding:16px}
    .aksi button{width:100%}
  </style>
  <script src="/jsQR.js" defer></script>
</head>
<body>
  <main>
    <h1>Kirim izin</h1>
    <p id="info-kegiatan">Memuat kegiatan…</p>

    <p id="pesan" role="status" aria-live="polite" hidden></p>

    <form id="form-izin" class="kartu" hidden>
      <fieldset id="pilihan">
        <legend>Verifikasi kode</legend>

        <div class="bidang">
          <label for="kode">Kode manual / kode QR</label>
          <input
            id="kode"
            type="text"
            maxlength="32"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            required
            aria-describedby="bantuan-kode"
          >
          <p id="bantuan-kode" class="bantuan">
            Masukkan kode manual 6 karakter atau tempel token QR
            32 karakter milik generus. Nama akan tampil setelah
            kode berhasil diperiksa.
          </p>

          <div class="aksi">
            <button
              id="scan"
              type="button"
              class="secondary"
              hidden
            >Scan barcode</button>

            <button
              id="hentikan-scan"
              type="button"
              class="secondary"
              hidden
            >Hentikan kamera</button>
          </div>

          <p id="bantuan-kamera" class="bantuan" hidden>
            Kamera tidak tersedia. Silakan isi kode secara manual.
          </p>

          <video
            id="video"
            autoplay
            muted
            playsinline
            aria-label="Pratinjau kamera untuk membaca kode QR"
            hidden
          ></video>
          <canvas id="canvas" hidden></canvas>
        </div>

        <div class="aksi">
          <button id="periksa" type="submit">Periksa kode</button>
        </div>
      </fieldset>

      <fieldset id="rincian" hidden disabled>
        <legend>Isi izin</legend>

        <div class="bidang">
          <p>Nama generus<br><span id="nama-generus" class="tag"></span></p>
        </div>

        <div class="bidang">
          <label for="alasan">Alasan tidak hadir</label>
          <select id="alasan" name="alasan" required>
            <option value="sakit">Sakit</option>
            <option value="izin">Izin</option>
          </select>
        </div>

        <div class="bidang">
          <label id="label-keterangan" for="keterangan">
            Keterangan (opsional)
          </label>
          <textarea
            id="keterangan"
            maxlength="500"
            rows="3"
          ></textarea>
        </div>

        <div class="aksi">
          <button id="kirim" type="submit">Kirim izin</button>
        </div>
      </fieldset>
    </form>
  </main>

  <script>
    'use strict';

    const token = new URLSearchParams(location.search).get('t');

    const form = document.getElementById('form-izin');
    const pilihan = document.getElementById('pilihan');
    const rincian = document.getElementById('rincian');
    const infoKegiatan = document.getElementById('info-kegiatan');
    const pesan = document.getElementById('pesan');

    const namaGenerus = document.getElementById('nama-generus');
    const alasan = document.getElementById('alasan');
    const keterangan = document.getElementById('keterangan');
    const labelKeterangan = document.getElementById('label-keterangan');
    const kode = document.getElementById('kode');
    const periksa = document.getElementById('periksa');
    const kirim = document.getElementById('kirim');

    const scan = document.getElementById('scan');
    const hentikanScan = document.getElementById('hentikan-scan');
    const bantuanKamera = document.getElementById('bantuan-kamera');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    let generusTerverifikasi = null;
    let kodeTerverifikasi = '';
    let sedangMengirim = false;
    let stream = null;
    let bingkai = null;
    let versiKamera = 0;

    function beriPesan(teks, jenis = 'info') {
      pesan.textContent = teks;
      pesan.dataset.jenis = jenis;
      pesan.hidden = !teks;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        credentials: 'same-origin',
        cache: 'no-store',
        headers: {
          Accept: 'application/json',
          ...(options.body ? { 'Content-Type': 'application/json' } : {})
        }
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error('Respons server tidak dapat dibaca.');
      }

      if (!response.ok) {
        const teks =
          typeof data?.error === 'string' ? data.error :
          typeof data?.message === 'string' ? data.message :
          'Permintaan belum berhasil. Silakan coba lagi.';

        const error = new Error(teks);
        error.status = response.status;
        throw error;
      }

      return data;
    }

    function alamatApi(path = '/api/izin') {
      const query = new URLSearchParams({ t: token || '' });
      return path + '?' + query.toString();
    }

    function formatTanggal(nilai) {
      const tanggal = new Date(String(nilai).slice(0, 10) + 'T12:00:00');

      if (Number.isNaN(tanggal.getTime())) {
        return String(nilai);
      }

      const hasil = new Intl.DateTimeFormat('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).format(tanggal);

      return hasil.charAt(0).toUpperCase() + hasil.slice(1);
    }

    function ubahAlasan() {
      keterangan.required = alasan.value === 'izin';
      keterangan.setCustomValidity('');
      labelKeterangan.textContent = alasan.value === 'izin'
        ? 'Alasan izin'
        : 'Keterangan (opsional)';
    }

    function hentikanKamera() {
      versiKamera += 1;

      if (bingkai !== null) {
        cancelAnimationFrame(bingkai);
        bingkai = null;
      }

      if (stream) {
        for (const track of stream.getTracks()) {
          track.stop();
        }
        stream = null;
      }

      video.pause();
      video.srcObject = null;
      video.hidden = true;
      hentikanScan.hidden = true;
      scan.disabled = false;
      canvas.width = 0;
      canvas.height = 0;
    }

    async function muatAwal() {
      try {
        const data = await api(alamatApi());
        const namaTingkat = {
          kelompok: 'Kelompok',
          desa: 'Desa',
          daerah: 'Daerah'
        };

        const lingkup = data.kelompok
          ? 'Kelompok ' + data.kelompok.nama
          : namaTingkat[data.pertemuan.tingkat];

        infoKegiatan.textContent =
          'Izin untuk kegiatan ' +
          formatTanggal(data.pertemuan.tanggal) +
          ' — ' + lingkup;

        form.hidden = false;
      } catch (error) {
        form.hidden = true;
        infoKegiatan.textContent = '';
        beriPesan(error.message, 'error');
      }
    }

    async function periksaKode() {
      if (sedangMengirim || !kode.reportValidity()) return;

      const kodeDikirim = kode.value.trim();

      hentikanKamera();
      sedangMengirim = true;
      pilihan.disabled = true;
      periksa.textContent = 'Memeriksa…';
      beriPesan('Memeriksa kode…');

      try {
        const data = await api(alamatApi('/api/izin/verifikasi'), {
          method: 'POST',
          body: JSON.stringify({ kode: kodeDikirim })
        });

        generusTerverifikasi = data.generus;
        kodeTerverifikasi = kodeDikirim;
        namaGenerus.textContent = data.generus.nama;

        pilihan.hidden = true;
        periksa.type = 'button';
        rincian.hidden = false;
        rincian.disabled = false;
        ubahAlasan();
        beriPesan('');
        alasan.focus();
      } catch (error) {
        beriPesan(
          error.status === 404 ? 'Kode tidak ditemukan.' : error.message,
          'error'
        );
      } finally {
        sedangMengirim = false;
        pilihan.disabled = generusTerverifikasi !== null;
        periksa.textContent = 'Periksa kode';
      }
    }

    alasan.addEventListener('change', ubahAlasan);

    keterangan.addEventListener('input', () => {
      keterangan.setCustomValidity('');
    });

    hentikanScan.addEventListener('click', hentikanKamera);

    scan.addEventListener('click', async () => {
      if (sedangMengirim || generusTerverifikasi !== null) return;

      hentikanKamera();
      const versi = versiKamera;

      scan.disabled = true;
      beriPesan('Arahkan kamera ke kode QR.');

      try {
        const kamera = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'environment' }
        });

        if (versi !== versiKamera) {
          for (const track of kamera.getTracks()) track.stop();
          return;
        }

        stream = kamera;
        video.srcObject = kamera;
        video.hidden = false;
        hentikanScan.hidden = false;
        await video.play();

        if (versi !== versiKamera) return;

        const context = canvas.getContext('2d', {
          willReadFrequently: true
        });

        if (!context) {
          throw new Error('Kamera tidak dapat digunakan.');
        }

        function bacaBingkai() {
          if (versi !== versiKamera || !stream) return;

          try {
            if (video.readyState >= 2 && video.videoWidth > 0) {
              const skala = Math.min(1, 720 / video.videoWidth);
              canvas.width = Math.round(video.videoWidth * skala);
              canvas.height = Math.round(video.videoHeight * skala);

              context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
              );

              const piksel = context.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
              );

              const hasil = window.jsQR(
                piksel.data,
                piksel.width,
                piksel.height
              );

              if (hasil) {
                const terbaca = hasil.data.trim();
                hentikanKamera();

                if (
                  /^[a-fA-F0-9]{32}$/.test(terbaca) ||
                  /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(terbaca)
                ) {
                  kode.value = terbaca;
                  beriPesan('Kode terbaca. Silakan periksa kode.');
                  periksa.focus();
                } else {
                  beriPesan(
                    'Kode yang terbaca bukan kode GENSA. Silakan coba lagi.',
                    'error'
                  );
                }

                return;
              }
            }

            bingkai = requestAnimationFrame(bacaBingkai);
          } catch {
            hentikanKamera();
            beriPesan(
              'Kode belum dapat dibaca. Silakan isi kode secara manual.',
              'error'
            );
          }
        }

        bingkai = requestAnimationFrame(bacaBingkai);
      } catch {
        if (versi !== versiKamera) return;

        hentikanKamera();
        beriPesan(
          'Kamera tidak dapat dibuka. Izinkan akses kamera atau isi kode manual.',
          'error'
        );
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (sedangMengirim) return;

      if (generusTerverifikasi === null) {
        await periksaKode();
        return;
      }

      if (alasan.value === 'izin' && !keterangan.value.trim()) {
        keterangan.setCustomValidity('Tuliskan alasan izin.');
        keterangan.reportValidity();
        return;
      }

      if (!form.reportValidity()) return;

      const body = {
        generus_id: generusTerverifikasi.id,
        alasan: alasan.value,
        keterangan: keterangan.value.trim() || null,
        kode: kodeTerverifikasi
      };

      hentikanKamera();
      sedangMengirim = true;
      rincian.disabled = true;
      kirim.textContent = 'Mengirim…';
      beriPesan('Mengirim izin…');

      try {
        await api(alamatApi(), {
          method: 'POST',
          body: JSON.stringify(body)
        });

        form.hidden = true;
        generusTerverifikasi = null;
        kodeTerverifikasi = '';
        kode.value = '';
        keterangan.value = '';
        namaGenerus.textContent = '';

        beriPesan(
          'Izin sudah dikirim. Menunggu persetujuan pengurus kelompok.'
        );
      } catch (error) {
        beriPesan(error.message, 'error');
      } finally {
        sedangMengirim = false;
        rincian.disabled = generusTerverifikasi === null;
        kirim.textContent = 'Kirim izin';
      }
    });

    window.addEventListener('pagehide', hentikanKamera);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) hentikanKamera();
    });

    window.addEventListener('DOMContentLoaded', () => {
      const kameraTersedia = Boolean(
        window.isSecureContext &&
        navigator.mediaDevices?.getUserMedia &&
        typeof window.jsQR === 'function'
      );

      scan.hidden = !kameraTersedia;
      bantuanKamera.hidden = kameraTersedia;
      ubahAlasan();
      muatAwal();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
