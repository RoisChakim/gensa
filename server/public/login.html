<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — GENSA</title>
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#8A5A33">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-brand">
      <img class="auth-logo" src="/icon-192.png" width="44" height="44" alt="">
      <div>
        <p class="auth-brand-name">GENSA</p>
        <p class="auth-brand-subtitle">Platform Manajemen Generus</p>
      </div>
    </div>
    <p class="auth-badge">● Masuk ke Platform</p>
    <h1>Selamat Datang</h1>

    <form id="login-form">
      <label for="email">ALAMAT EMAIL</label>
      <input id="email" name="email" type="email" autocomplete="username"
             placeholder="nama@email.com" required>

      <div class="auth-label-row">
        <label for="password">PASSWORD</label>
        <a class="auth-forgot" href="/reset-password.html">Lupa password?</a>
      </div>
      <div class="auth-password">
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="••••••••" required>
        <input class="auth-password-toggle" type="button" value="Lihat"
               aria-label="Tampilkan password" aria-controls="password"
               aria-pressed="false">
      </div>

      <button type="submit">Masuk ke Sistem →</button>
      <a class="auth-google" href="/api/auth/google">Masuk dengan Google</a>
      <p id="google-login-status" role="status" aria-live="polite" hidden></p>
    </form>

    <form id="change-form" hidden>
      <p class="auth-description">Untuk keamanan akun, ganti password sebelum melanjutkan.</p>

      <label for="old-password">Password lama</label>
      <input id="old-password" type="password"
             autocomplete="current-password" required>

      <label for="new-password">Password baru</label>
      <input id="new-password" type="password"
             autocomplete="new-password" minlength="8" required>

      <button type="submit">Simpan password</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <footer class="auth-footer">
      <span>Sistem Informasi Manajemen Generus</span>
      <span class="auth-version">v 1.0</span>
    </footer>
  </main>

  <script>
    'use strict';

    document.querySelector('.auth-password-toggle').addEventListener('click', (event) => {
      const passwordField = document.getElementById('password');
      const showPassword = passwordField.type === 'password';
      passwordField.type = showPassword ? 'text' : 'password';
      event.currentTarget.setAttribute(
        'aria-label',
        showPassword ? 'Sembunyikan password' : 'Tampilkan password'
      );
      event.currentTarget.setAttribute('aria-pressed', showPassword);
    });

    const loginForm = document.getElementById('login-form');
    const changeForm = document.getElementById('change-form');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    async function postJson(url, data) {
      const response = await fetch(url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      let result = {};
      try {
        result = await response.json();
      } catch {
        // Pesan umum ditampilkan jika respons bukan JSON.
      }
      return { response, result };
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = loginForm.querySelector('button');
      button.disabled = true;
      showMessage('');

      try {
        const { response, result } = await postJson('/api/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        if (!response.ok) {
          showMessage(
            response.status === 429
              ? 'Terlalu banyak percobaan. Coba lagi nanti.'
              : 'Email atau password salah.',
            true
          );
          return;
        }

        document.getElementById('password').value = '';

        if (result.user.must_change_password) {
          loginForm.hidden = true;
          changeForm.hidden = false;
          document.getElementById('old-password').focus();
        } else {
          window.location.replace('/dashboard.html');
        }
      } catch {
        showMessage('Tidak dapat terhubung ke server. Coba lagi.', true);
      } finally {
        button.disabled = false;
      }
    });

    changeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = changeForm.querySelector('button');
      button.disabled = true;
      showMessage('');

      try {
        const { response, result } = await postJson('/api/change-password', {
          old_password: document.getElementById('old-password').value,
          new_password: document.getElementById('new-password').value,
        });

        if (!response.ok) {
          showMessage(result.error || 'Password belum dapat diganti.', true);
          return;
        }

        changeForm.reset();
        changeForm.hidden = true;
        window.location.replace('/dashboard.html');
      } catch {
        showMessage('Tidak dapat terhubung ke server. Coba lagi.', true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
<script>
  (() => {
    const kode = new URLSearchParams(location.search).get('google');
    const pesan = new Map([
      [
        'tautan-kadaluarsa',
        'Tautan login sudah tidak berlaku. Coba lagi.',
      ],
      [
        'gagal',
        'Login Google gagal. Coba lagi atau masuk dengan email dan password.',
      ],
      [
        'belum-terdaftar',
        'Email Google ini belum terdaftar. Minta Admin mendaftarkan email Anda.',
      ],
    ]).get(kode);

    if (pesan) {
      const status = document.getElementById('google-login-status');
      status.textContent = pesan;
      status.hidden = false;
    }
  })();
</script>
</body>
</html>
