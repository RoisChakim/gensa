<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — GENSA</title>
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#8A5A33">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #34271e;
      background: #f6f1e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
    }

    main {
      max-width: 420px;
      margin: 8vh auto;
      padding: 28px;
      background: #fffdf9;
      border: 1px solid #ded3c3;
      border-radius: 12px;
    }

    h1 { margin: 0 0 8px; color: #8a5a33; }
    p { line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #a99986;
      border-radius: 6px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #b9cbb4;
      border-color: #5f7a57;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #8a5a33;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: wait; }
    .accent { color: #5f7a57; }
    .message { min-height: 1.5em; margin-bottom: 0; }
    .error { color: #9a3027; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>GENSA</h1>
    <p class="accent">Selamat datang. Silakan masuk untuk melanjutkan.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Masuk</button>
      <p><a href="/reset-password.html">Lupa password?</a></p>
      <a
        href="/api/auth/google"
        style="display:block;box-sizing:border-box;margin-top:12px;padding:12px 16px;border:1px solid #8A5A33;border-radius:8px;background:#F6F1E9;color:#8A5A33;text-align:center;text-decoration:none;font:inherit;"
      >
        Masuk dengan Google
      </a>
      <p id="google-login-status" role="status" aria-live="polite" hidden></p>
    </form>

    <form id="change-form" hidden>
      <p>Untuk keamanan akun, ganti password sebelum melanjutkan.</p>

      <label for="old-password">Password lama</label>
      <input id="old-password" type="password"
             autocomplete="current-password" required>

      <label for="new-password">Password baru</label>
      <input id="new-password" type="password"
             autocomplete="new-password" minlength="8" required>

      <button type="submit">Simpan password</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    'use strict';

    const loginForm = document.getElementById('login-form');
    const changeForm = document.getElementById('change-form');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    async function postJson(url, data) {
      const response = await fetch(url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      let result = {};
      try {
        result = await response.json();
      } catch {
        // Pesan umum ditampilkan jika respons bukan JSON.
      }
      return { response, result };
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = loginForm.querySelector('button');
      button.disabled = true;
      showMessage('');

      try {
        const { response, result } = await postJson('/api/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        if (!response.ok) {
          showMessage(
            response.status === 429
              ? 'Terlalu banyak percobaan. Coba lagi nanti.'
              : 'Email atau password salah.',
            true
          );
          return;
        }

        document.getElementById('password').value = '';

        if (result.user.must_change_password) {
          loginForm.hidden = true;
          changeForm.hidden = false;
          document.getElementById('old-password').focus();
        } else {
          showMessage('Berhasil masuk. Halaman utama belum tersedia.');
        }
      } catch {
        showMessage('Tidak dapat terhubung ke server. Coba lagi.', true);
      } finally {
        button.disabled = false;
      }
    });

    changeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = changeForm.querySelector('button');
      button.disabled = true;
      showMessage('');

      try {
        const { response, result } = await postJson('/api/change-password', {
          old_password: document.getElementById('old-password').value,
          new_password: document.getElementById('new-password').value,
        });

        if (!response.ok) {
          showMessage(result.error || 'Password belum dapat diganti.', true);
          return;
        }

        changeForm.reset();
        changeForm.hidden = true;
        showMessage('Password berhasil diganti. Halaman utama belum tersedia.');
      } catch {
        showMessage('Tidak dapat terhubung ke server. Coba lagi.', true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
<script>
  (() => {
    const kode = new URLSearchParams(location.search).get('google');
    const pesan = new Map([
      [
        'tautan-kadaluarsa',
        'Tautan login sudah tidak berlaku. Coba lagi.',
      ],
      [
        'gagal',
        'Login Google gagal. Coba lagi atau masuk dengan email dan password.',
      ],
      [
        'belum-terdaftar',
        'Email Google ini belum terdaftar. Minta Admin mendaftarkan email Anda.',
      ],
    ]).get(kode);

    if (pesan) {
      const status = document.getElementById('google-login-status');
      status.textContent = pesan;
      status.hidden = false;
    }
  })();
</script>
</body>
</html>
