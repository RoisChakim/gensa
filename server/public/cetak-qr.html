<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cetak QR Generus — GENSA</title>
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#8A5A33">
    <link rel="stylesheet" href="/app.css">
  <style>
    .intro{margin:0 0 20px}
    #kartu{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
    .kartu{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;border:1px solid #b7c5b1;border-radius:12px;background:#fffdf9;text-align:center;overflow-wrap:anywhere;margin-bottom:0;box-shadow:none}
    .kartu img{width:180px;height:180px;max-width:100%}
    .kartu h2{margin:0;font-size:1.4rem}
    .kartu p{margin:0}
    .kode{color:#5F7A57;font-family:monospace;font-size:1.6rem;font-weight:700;letter-spacing:.12em}
    .kartu button{margin-top:6px}
    .kartu .foto{width:120px;height:150px;object-fit:cover;border-radius:8px;border:1px solid #b7c5b1;background:#F6F1E9}
    .kartu .tanpa-foto{width:120px;height:150px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px dashed #b7c5b1;background:#F6F1E9;color:#5F7A57}
    .kartu .wilayah{color:#5F7A57}
    @media print{
      h1,.intro,#pesan,button{display:none !important}
      #kartu{display:block}
      .kartu{width:100%;min-height:95mm;margin:0 0 8mm;border:1px solid #777;break-inside:avoid;page-break-inside:avoid}
      body.cetak-satu .kartu:not(.dipilih){display:none}
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <button class="menu-btn" id="closeMenuBtn" type="button" aria-label="Tutup menu">×</button>
      <div class="brand-row">
        <div class="brand-logo"><img src="/icon-192.png" alt="Logo GENSA"></div>
        <div><div class="brand-name" style="font-size:16px">GENSA</div><div class="brand-sub">Platform Manajemen Generus</div></div>
      </div>
      <a class="side-link" href="/dashboard.html"><span class="ic">▦</span> Dashboard</a>
      <a class="side-link" href="/generus.html"><span class="ic">👥</span> Daftar Generus</a>
      <a class="side-link" id="kelasMenu" href="/kelas.html" hidden><span class="ic">☷</span> Kelas</a>
      <a class="side-link" href="/materi.html"><span class="ic">📖</span> Materi</a>
      <a class="side-link" href="/jadwal.html"><span class="ic">🗓</span> Jadwal Mengaji</a>
      <a class="side-link" href="/izin-kelola.html"><span class="ic">✉️</span> Izin</a>
      <a class="side-link" href="/laporan.html"><span class="ic">💬</span> Laporan WhatsApp</a>
      <a class="side-link" href="/arsip.html"><span class="ic">🗂</span> Arsip</a>
      <a class="side-link active" href="/cetak-qr.html"><span class="ic">▣</span> Cetak QR Code</a>
      <a class="side-link" id="akunLink" href="/akun.html" hidden><span class="ic">⚙</span> Akun</a>
      <div class="side-user">
        <div class="nm" id="userName"></div>
        <div class="rl" id="userRole"></div>
        <button id="logoutBtn" type="button">Keluar</button>
      </div>
    </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="title-row">
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">☰</button>
          <h2 id="pageTitle">Cetak QR Generus</h2>
        </div>
        <div class="sub" id="pageSub">Cetak semua kartu atau pilih kartu yang ingin dicetak.</div>
      </div>
      <span class="scope-badge" id="scopeBadge"></span>
    </div>

    
    
    <button id="cetak-semua" type="button" disabled>Cetak semua</button>
    <p id="pesan" role="status" aria-live="polite">Memuat data generus…</p>
    <div id="kartu"></div>
    </main>
</div>

  <script>
    'use strict';

    const pesan = document.getElementById('pesan');
    const daftar = document.getElementById('kartu');
    const cetakSemua = document.getElementById('cetak-semua');

    function bersihkanPilihan() {
      document.body.classList.remove('cetak-satu');
      for (const kartu of daftar.querySelectorAll('.dipilih')) {
        kartu.classList.remove('dipilih');
      }
    }

    window.addEventListener('afterprint', bersihkanPilihan);

    cetakSemua.addEventListener('click', () => {
      bersihkanPilihan();
      window.print();
    });

    function buatKartu(generus) {
      const kartu = document.createElement('article');
      kartu.className = 'kartu';

      const gambar = document.createElement('img');
      gambar.src = `/api/generus/${encodeURIComponent(generus.id)}/qr.svg`;
      gambar.alt = `QR ${generus.nama}`;
      gambar.width = 180;
      gambar.height = 180;

      const nama = document.createElement('h2');
      nama.textContent = generus.nama;

      let foto;
      if (generus.foto_url) {
        foto = document.createElement('img');
        foto.className = 'foto';
        foto.src = `/api/generus/${encodeURIComponent(generus.id)}/foto`;
        foto.alt = `Foto ${generus.nama}`;
      } else {
        foto = document.createElement('div');
        foto.className = 'tanpa-foto';
        foto.textContent = 'Tanpa foto';
      }

      const kelas = document.createElement('p');
      kelas.textContent = `${generus.kelas_sekolah} · ${generus.jenjang}`;

      const kelompok = document.createElement('p');
      kelompok.className = 'wilayah';
      kelompok.textContent = `${generus.kelompok_nama} · ${generus.desa_nama}`;

      const daerah = document.createElement('p');
      daerah.className = 'wilayah';
      daerah.textContent = generus.daerah_nama;

      const labelKode = document.createElement('p');
      labelKode.textContent = 'Kode manual';

      const kode = document.createElement('p');
      kode.className = 'kode';
      kode.textContent = generus.kode_manual;

      const tombol = document.createElement('button');
      tombol.type = 'button';
      tombol.textContent = 'Cetak kartu ini';
      tombol.addEventListener('click', () => {
        bersihkanPilihan();
        kartu.classList.add('dipilih');
        document.body.classList.add('cetak-satu');
        window.print();
      });

      kartu.append(foto, nama, kelompok, daerah, kelas, gambar, labelKode, kode, tombol);
      return kartu;
    }

    async function mulai() {
      try {
        const meResponse = await fetch('/api/me', { cache: 'no-store' });
        if (meResponse.status === 401) {
          window.location.replace('/login.html');
          return;
        }
        if (!meResponse.ok) throw new Error('Gagal memeriksa akun.');

        const me = await meResponse.json();
        if (me.user.role !== 'kelompok') {
          pesan.textContent = 'Halaman ini untuk pengurus kelompok.';
          return;
        }

        const response = await fetch('/api/generus?status=approved', {
          cache: 'no-store',
        });
        if (response.status === 401) {
          window.location.replace('/login.html');
          return;
        }
        if (!response.ok) throw new Error('Gagal memuat data generus.');

        const data = await response.json();
        if (!Array.isArray(data.generus)) {
          throw new Error('Data generus tidak tersedia.');
        }

        if (data.generus.length === 0) {
          pesan.textContent =
            'Belum ada generus yang disetujui. Minta persetujuan Admin dulu.';
          return;
        }

        for (const generus of data.generus) {
          daftar.append(buatKartu(generus));
        }

        pesan.textContent = `${data.generus.length} kartu siap dicetak.`;
        cetakSemua.disabled = false;
      } catch {
        pesan.textContent = 'Data belum bisa dimuat. Coba muat ulang halaman.';
      }
    }

    mulai();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

<script>
/* Navigasi sidebar v1 (Sesi 12d) — isi nama/peran, tombol keluar, menu HP. */
(function () {
  'use strict';
  var sidebar = document.getElementById('sidebar');
  var menuBtn = document.getElementById('menuBtn');
  var akunLink = document.getElementById('akunLink');
  var kelasLink = document.getElementById('kelasMenu');
  var roleLabels = { admin: 'Admin \u00b7 akses penuh', daerah: 'Daerah', desa: 'Desa', kelompok: 'Kelompok' };
  function setMenu(open) {
    if (!sidebar || !menuBtn) return;
    sidebar.classList.toggle('open', !!open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if (menuBtn) menuBtn.addEventListener('click', function () { setMenu(!sidebar.classList.contains('open')); });
  var closeBtn = document.getElementById('closeMenuBtn');
  if (closeBtn) closeBtn.addEventListener('click', function () { setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', async function () {
    logoutBtn.disabled = true;
    try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    window.location.replace('/login.html');
  });
  fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) {
      if (r.status === 401) { window.location.replace('/login.html'); return null; }
      return r.json();
    })
    .then(function (data) {
      if (!data || !data.user) return;
      var u = data.user;
      var name = document.getElementById('userName'); if (name) name.textContent = u.email || '';
      var label = roleLabels[u.role] || u.role || '';
      var role = document.getElementById('userRole'); if (role) role.textContent = label;
      var badge = document.getElementById('scopeBadge'); if (badge) badge.textContent = label;
      if (u.role === 'admin' && akunLink) akunLink.hidden = false;
      if (u.role === 'admin' && kelasLink) kelasLink.hidden = false;
    })
    .catch(function () {});
})();
</script>

</body>
</html>
