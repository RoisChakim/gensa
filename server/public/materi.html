<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi &amp; Penilaian — GENSA</title>
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#8A5A33">
  <style>
    :root {
      color-scheme: light;
      --cream: #F6F1E9;
      --brown: #8A5A33;
      --sage: #5F7A57;
      --sage-light: #7C9A6E;
      --text: #44382D;
      --muted: #6C6155;
      --border: #D9CDBC;
      --paper: #FFFCF7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 14px 48px;
    }

    a {
      color: var(--brown);
    }

    h1, h2, h3 {
      color: var(--brown);
      line-height: 1.25;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    h2 {
      margin-top: 0;
      font-size: 1.35rem;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 1.05rem;
    }

    section {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--paper);
      min-width: 0;
    }

    p {
      margin: 8px 0 14px;
    }

    .muted, small {
      color: var(--muted);
    }

    small {
      display: block;
      margin-top: 4px;
      font-size: .85rem;
    }

    .message {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--paper);
      overflow-wrap: anywhere;
    }

    .error {
      border-color: var(--brown);
      color: #754225;
    }

    .warning {
      padding: 12px;
      background: var(--cream);
      border-left: 4px solid var(--brown);
      border-radius: 4px;
    }

    [hidden] {
      display: none !important;
    }

    form {
      display: grid;
      gap: 12px;
      margin: 18px 0;
      padding: 14px;
      background: var(--cream);
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 5px;
      font-weight: 600;
    }

    input, select, button, .button {
      font: inherit;
      min-height: 44px;
      border-radius: 7px;
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--border);
    }

    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border: 1px solid var(--sage);
      background: var(--sage);
      color: white;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover:not(:disabled), .button:hover {
      background: #526A4B;
    }

    .secondary {
      background: var(--paper);
      color: var(--brown);
      border-color: var(--border);
    }

    .secondary:hover:not(:disabled) {
      background: var(--cream);
    }

    button:disabled, input:disabled, select:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 3px solid var(--sage-light);
      outline-offset: 3px;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0 0 18px;
    }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .task-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .task-row button {
      flex-shrink: 0;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: .95rem;
    }

    caption {
      text-align: left;
      padding: 12px;
      color: var(--muted);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    thead th {
      background: var(--cream);
      color: var(--brown);
    }

    tbody tr:last-child > * {
      border-bottom: 0;
    }

    .matrix th:first-child {
      min-width: 220px;
      max-width: 320px;
    }

    .matrix thead th:not(:first-child) {
      min-width: 150px;
      max-width: 260px;
      overflow-wrap: anywhere;
    }

    .matrix tbody th {
      font-weight: normal;
      overflow-wrap: anywhere;
    }

    .matrix td {
      text-align: center;
    }

    .score-button {
      min-width: 84px;
    }

    .change-note {
      font-weight: normal;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 190px;
    }

    .result-name {
      min-width: 170px;
      overflow-wrap: anywhere;
    }

    .required-note {
      color: var(--brown);
      font-weight: 600;
    }

    @media (min-width: 720px) {
      main {
        padding: 28px 24px 56px;
      }

      section {
        padding: 24px;
      }

      form {
        grid-template-columns: minmax(0, 2fr) minmax(180px, 1fr) auto;
        align-items: end;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="/">← Beranda GENSA</a>
      <h1>Materi &amp; Penilaian</h1>
      <p class="muted">Kelola tugas, catat perkembangan, dan bagikan hasil hafalan.</p>
    </header>

    <p id="notice" class="message" role="status" aria-live="polite" hidden></p>
    <p id="error" class="message error" role="alert" hidden></p>

    <section aria-labelledby="tugas-heading">
      <h2 id="tugas-heading">Tugas</h2>

      <form id="task-form" hidden>
        <label for="judul">
          Judul tugas
          <input
            id="judul"
            name="judul"
            type="text"
            maxlength="255"
            required
            autocomplete="off"
          >
        </label>

        <label for="kategori">
          Kategori
          <select id="kategori" name="kategori" required>
            <option value="doa_surat">Doa &amp; Surat</option>
            <option value="makna_pegon">Makna Pegon</option>
            <option value="praktik_solat">Praktik Solat</option>
          </select>
        </label>

        <button id="add-task" type="submit">Tambah tugas</button>
      </form>

      <p id="task-scope" class="muted" hidden></p>
      <div id="task-list">
        <p class="muted">Memuat tugas…</p>
      </div>
    </section>

    <section aria-labelledby="penilaian-heading">
      <h2 id="penilaian-heading">Penilaian</h2>
      <p id="score-help" class="muted"></p>
      <div id="score-content">
        <p class="muted">Memuat penilaian…</p>
      </div>
    </section>

    <section aria-labelledby="hasil-heading">
      <h2 id="hasil-heading">Hasil</h2>
      <p id="hafalan-warning" class="warning" hidden>
        Belum ada tugas hafalan (Doa &amp; Surat). Tambahkan tugas dulu.
      </p>
      <div id="result-content">
        <p class="muted">Memuat hasil…</p>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    const categories = [
      ['doa_surat', 'Doa & Surat'],
      ['makna_pegon', 'Makna Pegon'],
      ['praktik_solat', 'Praktik Solat'],
    ];

    const categoryNames = new Map(categories);
    const scoreNames = {
      hafal: 'Hafal',
      belum: 'Belum',
      bisa: 'Bisa',
      tidak: 'Tidak',
    };

    const taskForm = document.getElementById('task-form');
    const titleInput = document.getElementById('judul');
    const categoryInput = document.getElementById('kategori');
    const addTaskButton = document.getElementById('add-task');
    const notice = document.getElementById('notice');
    const errorBox = document.getElementById('error');

    let currentUser = null;
    let data = { tugas: [], penilaian: [], hasil: [] };
    let busy = false;

    function element(tag, text, className) {
      const node = document.createElement(tag);

      if (text !== undefined && text !== null) {
        node.textContent = String(text);
      }

      if (className) {
        node.className = className;
      }

      return node;
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.hidden = !message;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = !message;
    }

    function canWrite() {
      return currentUser &&
        (currentUser.role === 'admin' || currentUser.role === 'kelompok');
    }

    function canDelete(task) {
      if (currentUser.role === 'admin') return true;

      return currentUser.role === 'kelompok' &&
        task.kelompok_id !== null &&
        Number(task.kelompok_id) === Number(currentUser.kelompok_id);
    }

    function scoreKey(generusId, taskId) {
      return String(generusId) + ':' + String(taskId);
    }

    function changeLabel(score) {
      if (score.diubah_count >= 2 && currentUser.role !== 'admin') {
        return 'terkunci — minta Admin';
      }

      return 'diubah ' + score.diubah_count + 'x';
    }

    function nextScore(task, score) {
      if (task.kategori === 'doa_surat') {
        return score && score.nilai === 'hafal' ? 'belum' : 'hafal';
      }

      return score && score.nilai === 'bisa' ? 'tidak' : 'bisa';
    }

    function taskOwner(task) {
      return task.kelompok_id === null
        ? 'Semua kelompok'
        : (task.kelompok_nama || 'Kelompok');
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        credentials: 'same-origin',
        headers: {
          Accept: 'application/json',
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        },
      });

      if (response.status === 401) {
        window.location.replace('/login.html');
        throw new Error('Silakan masuk kembali.');
      }

      const payload = await response.json().catch(() => null);

      if (!response.ok) {
        const message = payload && (
          typeof payload.error === 'string'
            ? payload.error
            : typeof payload.message === 'string'
              ? payload.message
              : payload.error && payload.error.message
        );

        throw new Error(
          typeof message === 'string'
            ? message
            : 'Permintaan gagal. Silakan coba lagi.'
        );
      }

      if (!payload) {
        throw new Error('Respons server tidak valid.');
      }

      return payload;
    }

    function createTable(headers, captionText, className) {
      const wrapper = element('div', null, 'table-wrap');
      wrapper.tabIndex = 0;
      wrapper.setAttribute('role', 'region');
      wrapper.setAttribute('aria-label', captionText);

      const table = element('table', null, className);
      const caption = element('caption', captionText);
      const thead = element('thead');
      const headerRow = element('tr');

      for (const title of headers) {
        const th = element('th', title);
        th.scope = 'col';
        headerRow.append(th);
      }

      thead.append(headerRow);

      const tbody = element('tbody');
      table.append(caption, thead, tbody);
      wrapper.append(table);

      return { wrapper, table, thead, tbody };
    }

    function renderTasks() {
      const root = document.getElementById('task-list');
      root.replaceChildren();

      taskForm.hidden = !canWrite();
      titleInput.disabled = busy;
      categoryInput.disabled = busy;
      addTaskButton.disabled = busy;

      const scopeHint = document.getElementById('task-scope');
      scopeHint.hidden = !canWrite();

      if (canWrite()) {
        scopeHint.textContent = currentUser.role === 'admin'
          ? 'Tugas yang ditambahkan di halaman ini berlaku untuk semua kelompok.'
          : 'Tugas yang ditambahkan berlaku untuk kelompok Anda.';
      }

      if (!data.tugas.length) {
        root.append(element('p', 'Belum ada tugas yang dapat ditampilkan.', 'muted'));
      }

      for (const [category, name] of categories) {
        const group = element('div');
        group.append(element('h3', name));

        const tasks = data.tugas.filter((task) => task.kategori === category);

        if (!tasks.length) {
          group.append(element('p', 'Belum ada tugas dalam kategori ini.', 'muted'));
          root.append(group);
          continue;
        }

        const list = element('ul', null, 'task-list');

        for (const task of tasks) {
          const row = element('li', null, 'task-row');
          const text = element('div', null, 'task-text');

          text.append(
            element('strong', task.judul),
            element('small', taskOwner(task))
          );
          row.append(text);

          if (canDelete(task)) {
            const button = element('button', 'Hapus', 'secondary');
            button.type = 'button';
            button.disabled = busy;
            button.setAttribute('aria-label', 'Hapus tugas ' + task.judul);
            button.addEventListener('click', () => {
              mutate(
                () => api('/api/tugas/' + encodeURIComponent(task.id), {
                  method: 'DELETE',
                }),
                'Tugas dihapus.'
              );
            });
            row.append(button);
          }

          list.append(row);
        }

        group.append(list);
        root.append(group);
      }
    }

    function renderScores() {
      const root = document.getElementById('score-content');
      const help = document.getElementById('score-help');
      root.replaceChildren();

      help.textContent = canWrite()
        ? 'Klik tombol untuk mencatat Hafal atau Bisa. Klik nilai untuk mengganti ke pasangannya. Nilai dapat diubah dua kali; Admin dapat membuka kembali kesempatan mengubah.'
        : 'Anda dapat melihat penilaian. Pengurus kelompok dan Admin dapat mencatat atau mengubah nilai.';

      if (!data.tugas.length) {
        root.append(element(
          'p',
          'Belum ada tugas. Tambahkan tugas terlebih dahulu untuk memulai penilaian.',
          'muted'
        ));
      }

      if (!data.hasil.length) {
        root.append(element(
          'p',
          'Belum ada generus berstatus disetujui dalam wilayah Anda.',
          'muted'
        ));
      }

      if (!data.tugas.length || !data.hasil.length) return;

      const scores = new Map(
        data.penilaian.map((score) => [
          scoreKey(score.generus_id, score.tugas_id),
          score,
        ])
      );

      const grid = createTable(
        ['Generus', ...data.tugas.map((task) => task.judul)],
        'Penilaian per generus dan tugas. Geser tabel untuk melihat semua kolom.',
        'matrix'
      );

      const taskHeaders = grid.thead.querySelectorAll('th');

      data.tugas.forEach((task, index) => {
        taskHeaders[index + 1].append(
          element('small', categoryNames.get(task.kategori)),
          element('small', taskOwner(task))
        );
      });

      for (const generus of data.hasil) {
        const row = element('tr');
        const nameCell = element('th');
        nameCell.scope = 'row';

        nameCell.append(
          element('strong', generus.nama),
          element(
            'small',
            'Kelas ' + (generus.kelas_sekolah || '—') +
              ' · ' + generus.jenjang
          ),
          element('small', generus.kelompok)
        );

        for (const task of data.tugas) {
          const score = scores.get(scoreKey(generus.generus_id, task.id));

          if (score) {
            nameCell.append(element(
              'small',
              task.judul + ': ' + changeLabel(score),
              'change-note'
            ));
          }
        }

        row.append(nameCell);

        for (const task of data.tugas) {
          const cell = element('td');
          const score = scores.get(scoreKey(generus.generus_id, task.id));
          const locked = Boolean(
            score &&
            score.diubah_count >= 2 &&
            currentUser.role !== 'admin'
          );

          const label = score ? scoreNames[score.nilai] : '—';
          const value = nextScore(task, score);
          const button = element(
            'button',
            label,
            score ? 'score-button' : 'score-button secondary'
          );

          button.type = 'button';
          button.disabled = busy || !canWrite() || locked;
          button.setAttribute(
            'aria-label',
            generus.nama + ', ' + task.judul + ': ' +
              (score ? label : 'belum dinilai') +
              (locked ? ', terkunci — minta Admin' : '')
          );

          if (canWrite() && !locked) {
            button.title = 'Catat ' + scoreNames[value];
          }

          button.addEventListener('click', () => {
            mutate(
              () => api('/api/penilaian', {
                method: 'POST',
                body: JSON.stringify({
                  generus_id: generus.generus_id,
                  tugas_id: task.id,
                  nilai: value,
                }),
              }),
              'Nilai ' + generus.nama + ' disimpan.'
            );
          });

          cell.append(button);
          row.append(cell);
        }

        grid.tbody.append(row);
      }

      root.append(grid.wrapper);
    }

    function resultMessage(generus) {
      const persen = generus.persen === null ? '—' : generus.persen;

      return 'Hasil hafalan ' + generus.nama +
        ' (' + (generus.kelas_sekolah || '—') + '): ' +
        generus.hafal + '/' + generus.total_hafalan +
        ' tugas hafal (' + persen + '%).';
    }

    function whatsappNumber(value) {
      let number = String(value || '').replace(/\D/g, '');

      if (number.startsWith('0')) {
        number = '62' + number.slice(1);
      }

      return number;
    }

    function renderResults() {
      const root = document.getElementById('result-content');
      root.replaceChildren();

      const warning = document.getElementById('hafalan-warning');
      warning.hidden =
        data.tugas.some((task) => task.kategori === 'doa_surat') &&
        !data.hasil.some((generus) => generus.total_hafalan === 0);

      if (!data.hasil.length) {
        root.append(element(
          'p',
          'Belum ada hasil karena belum ada generus berstatus disetujui.',
          'muted'
        ));
        return;
      }

      const resultTable = createTable(
        ['Nama', 'Kelas', 'Jenjang', 'Hafal', 'Total', '% Hasil', 'Bagikan'],
        'Hasil hafalan berdasarkan tugas Doa & Surat yang berlaku untuk kelompok masing-masing.'
      );

      for (const generus of data.hasil) {
        const row = element('tr');
        const nameCell = element('th', null, 'result-name');
        nameCell.scope = 'row';
        nameCell.append(
          element('strong', generus.nama),
          element('small', generus.kelompok)
        );

        if (generus.jenjang === 'caberawit' && generus.total_hafalan === 0) {
          nameCell.append(element(
            'small',
            '(PAUD–SD: wajib ada tugas)',
            'required-note'
          ));
        }

        row.append(
          nameCell,
          element('td', generus.kelas_sekolah || '—'),
          element('td', generus.jenjang),
          element('td', generus.hafal),
          element('td', generus.total_hafalan),
          element('td', generus.persen === null ? '—' : generus.persen + '%')
        );

        const actionCell = element('td');
        const actions = element('div', null, 'actions');
        const message = resultMessage(generus);
        const number = whatsappNumber(generus.ortu_hp);

        if (number) {
          const link = element('a', 'Kirim WA', 'button');
          link.href = 'https://wa.me/' + number +
            '?text=' + encodeURIComponent(message);
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.setAttribute(
            'aria-label',
            'Kirim hasil ' + generus.nama + ' melalui WhatsApp'
          );
          actions.append(link);
        } else {
          const unavailable = element('button', 'Kirim WA');
          unavailable.type = 'button';
          unavailable.disabled = true;
          unavailable.title = 'Nomor WhatsApp orang tua belum tersedia.';
          actions.append(unavailable);
        }

        const copy = element('button', 'Salin', 'secondary');
        copy.type = 'button';
        copy.disabled = busy;
        copy.setAttribute('aria-label', 'Salin hasil ' + generus.nama);

        copy.addEventListener('click', async () => {
          showError('');
          showNotice('');

          try {
            if (!navigator.clipboard ||
                typeof navigator.clipboard.writeText !== 'function') {
              throw new Error(
                'Penyalinan tidak tersedia. Buka halaman melalui HTTPS atau localhost.'
              );
            }

            await navigator.clipboard.writeText(message);
            showNotice('Tersalin.');
          } catch (error) {
            showError(error.message || 'Hasil belum berhasil disalin.');
          }
        });

        actions.append(copy);
        actionCell.append(actions);
        row.append(actionCell);
        resultTable.tbody.append(row);
      }

      root.append(resultTable.wrapper);
    }

    function render() {
      renderTasks();
      renderScores();
      renderResults();
    }

    async function mutate(action, successMessage, afterSuccess) {
      if (busy) return;

      busy = true;
      showError('');
      showNotice('');
      render();

      let saved = false;

      try {
        await action();
        saved = true;

        if (afterSuccess) afterSuccess();

        data = await api('/api/penilaian');
        showNotice(successMessage);
      } catch (error) {
        if (saved) {
          showError(
            successMessage +
            ' Tampilan belum berhasil dimuat ulang. Muat ulang halaman sebelum mengubah nilai lagi.'
          );
        } else {
          showError(error.message || 'Perubahan belum berhasil disimpan.');
        }
      } finally {
        // Jika penyimpanan berhasil tetapi pemuatan ulang gagal,
        // cegah perubahan lanjutan menggunakan data yang sudah kedaluwarsa.
        busy = saved && !notice.textContent;
        render();
      }
    }

    taskForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!canWrite() || busy) return;

      const judul = titleInput.value.trim();

      if (!judul || judul.length > 255) {
        showError('Judul harus berisi 1–255 karakter.');
        titleInput.focus();
        return;
      }

      mutate(
        () => api('/api/tugas', {
          method: 'POST',
          body: JSON.stringify({
            judul,
            kategori: categoryInput.value,
          }),
        }),
        'Tugas ditambahkan.',
        () => {
          titleInput.value = '';
        }
      );
    });

    async function initialize() {
      try {
        const [session, initialData] = await Promise.all([
          api('/api/me'),
          api('/api/penilaian'),
        ]);

        currentUser = session.user || session;

        if (!currentUser ||
            !['kelompok', 'desa', 'daerah', 'admin'].includes(currentUser.role)) {
          throw new Error('Data pengguna tidak valid. Silakan masuk kembali.');
        }

        data = initialData;
        render();
      } catch (error) {
        showError(error.message || 'Halaman belum berhasil dimuat.');

        for (const id of ['task-list', 'score-content', 'result-content']) {
          document.getElementById(id).replaceChildren(
            element('p', 'Data belum dapat dimuat. Muat ulang halaman untuk mencoba lagi.', 'muted')
          );
        }
      }
    }

    initialize();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
